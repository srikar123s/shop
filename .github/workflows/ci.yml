name: CI Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  flutter-and-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and test Cloud Functions logic
        working-directory: functions
        run: |
          npm install --no-audit --no-fund
          node --check index.js
          node --test storage_manager.test.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install SQLite3 for FFI tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run Flutter analyzer
        run: flutter analyze

      - name: Run Flutter test suite
        run: flutter test

      - name: Build Debug APK smoke check
        run: flutter build apk --debug --flavor wholesale
